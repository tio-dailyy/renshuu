<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>日本の街角単語帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sign-blue:#0B5FA5;
    --sign-blue-dark:#063E6E;
    --sign-red:#C8102E;
    --sign-red-dark:#8C0A20;
    --sign-yellow:#FFD400;
    --sign-yellow-dark:#9C7E00;
    --sign-green:#1B7A3D;
    --sign-green-dark:#0F4E27;
    --concrete:#EDEAE0;
    --concrete-line:#D8D4C6;
    --ink:#1C1C1C;
    --pole:#8C8C86;
    --white:#FAFAF7;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      repeating-linear-gradient(90deg, transparent, transparent 78px, rgba(0,0,0,0.02) 78px, rgba(0,0,0,0.02) 80px),
      var(--concrete);
    font-family:'Noto Sans JP','Oswald',sans-serif;
    color:var(--ink);
    padding:20px 14px 40px;
  }
  .wrap{max-width:640px;margin:0 auto;}

  .masthead{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:18px;
  }
  .masthead h1{
    font-family:'Oswald',sans-serif;
    font-weight:700;
    font-size:20px;
    letter-spacing:0.5px;
    margin:0;
    color:var(--sign-blue-dark);
  }
  .masthead .route{
    font-family:'Oswald',sans-serif;
    background:var(--sign-green);
    color:var(--white);
    font-weight:600;
    font-size:13px;
    padding:5px 10px;
    border:2px solid var(--white);
    outline:2px solid var(--sign-green-dark);
    border-radius:3px;
    white-space:nowrap;
  }

  .catbar{
    display:flex;gap:8px;flex-wrap:wrap;
    margin-bottom:18px;
  }
  .catbtn{
    font-family:'Noto Sans JP',sans-serif;
    font-size:12px;
    font-weight:500;
    border:none;
    cursor:pointer;
    padding:7px 12px 7px 10px;
    display:flex;align-items:center;gap:6px;
    border-radius:20px;
    background:var(--white);
    border:1.5px solid var(--concrete-line);
    color:var(--ink);
    transition:transform .12s ease;
  }
  .catbtn .dot{width:12px;height:12px;flex:none;}
  .catbtn.prohibit .dot{background:var(--sign-red);border-radius:50%;border:2px solid var(--ink);}
  .catbtn.warn .dot{background:var(--sign-yellow);clip-path:polygon(50% 0,100% 100%,0 100%);}
  .catbtn.guide .dot{background:var(--sign-blue);border-radius:2px;}
  .catbtn.shop .dot{background:var(--sign-green);transform:rotate(45deg);}
  .catbtn.active{background:var(--ink);color:var(--white);border-color:var(--ink);}
  .catbtn:active{transform:scale(0.96);}

  .stage{
    display:flex;flex-direction:column;align-items:center;
    margin-bottom:16px;
  }

  .pole{
    width:10px;height:22px;
    background:linear-gradient(90deg,#6b6b66,var(--pole),#6b6b66);
    border-radius:2px 2px 0 0;
  }

  .signboard{
    width:100%;
    max-width:420px;
    aspect-ratio:4/3;
    perspective:1400px;
    cursor:pointer;
    user-select:none;
  }
  .signboard .inner{
    position:relative;width:100%;height:100%;
    transition:transform .5s cubic-bezier(.4,.2,.2,1);
    transform-style:preserve-3d;
  }
  .signboard.flipped .inner{transform:rotateY(180deg);}
  .face{
    position:absolute;inset:0;
    border-radius:14px;
    backface-visibility:hidden;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:20px;
    border:6px solid var(--white);
    outline:3px solid var(--sign-blue-dark);
    outline-offset:-2px;
  }
  .face.front{background:var(--sign-blue);color:var(--white);}
  .face.back{
    background:var(--white);
    color:var(--ink);
    transform:rotateY(180deg);
    outline-color:var(--sign-blue-dark);
  }
  .cat-prohibit .face{outline-color:var(--sign-red-dark);}
  .cat-prohibit .face.front{background:var(--sign-red);}
  .cat-warn .face{outline-color:var(--sign-yellow-dark);}
  .cat-warn .face.front{background:var(--sign-yellow);color:var(--ink);}
  .cat-guide .face{outline-color:var(--sign-blue-dark);}
  .cat-guide .face.front{background:var(--sign-blue);}
  .cat-shop .face{outline-color:var(--sign-green-dark);}
  .cat-shop .face.front{background:var(--sign-green);}

  .kanji-line{
    font-size:44px;font-weight:700;
    line-height:1.3;text-align:center;
  }
  ruby{ruby-position:over;}
  rt{font-size:15px;font-weight:500;opacity:0.92;transition:opacity .15s ease;}
  body.hide-furi rt{opacity:0;}
  body.hide-furi .kanji-line{cursor:pointer;}
  body.hide-furi .kanji-line::after{
    content:'タップで読み方を確認';
    display:block;font-family:'Oswald',sans-serif;
    font-size:10px;letter-spacing:1px;text-transform:uppercase;
    opacity:0.75;margin-top:8px;
  }
  body.hide-furi .kanji-line.reveal rt{opacity:0.92;}
  body.hide-furi .kanji-line.reveal::after{display:none;}
  .hint{
    margin-top:14px;font-family:'Oswald',sans-serif;
    font-size:11px;letter-spacing:1.5px;text-transform:uppercase;
    opacity:0.75;
  }
  .meaning{
    font-size:24px;font-weight:500;text-align:center;line-height:1.4;
  }
  .cat-label{
    font-family:'Oswald',sans-serif;
    font-size:11px;letter-spacing:1.5px;text-transform:uppercase;
    color:var(--sign-blue-dark);
    margin-top:10px;
  }
  .cat-prohibit .cat-label{color:var(--sign-red-dark);}
  .cat-warn .cat-label{color:var(--sign-yellow-dark);}
  .cat-guide .cat-label{color:var(--sign-blue-dark);}
  .cat-shop .cat-label{color:var(--sign-green-dark);}

  .controls{
    display:flex;align-items:center;justify-content:center;gap:14px;
    margin-top:16px;
  }
  .ctrlbtn{
    background:var(--white);
    border:1.5px solid var(--ink);
    color:var(--ink);
    width:42px;height:42px;
    border-radius:50%;
    font-size:18px;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:transform .1s ease;
  }
  .ctrlbtn:active{transform:scale(0.9);}
  .ctrlbtn.audio{border-color:var(--sign-blue-dark);color:var(--sign-blue-dark);}
  .progress-post{
    display:flex;flex-direction:column;align-items:center;
    font-family:'Oswald',sans-serif;
  }
  .progress-num{font-size:15px;font-weight:600;}
  .progress-track{
    width:120px;height:5px;background:var(--concrete-line);
    border-radius:3px;overflow:hidden;margin-top:4px;
  }
  .progress-fill{height:100%;background:var(--sign-green);border-radius:3px;transition:width .25s ease;}

  .toolbar{
    display:flex;justify-content:center;gap:10px;margin-top:18px;
  }
  .toolbtn{
    font-family:'Noto Sans JP',sans-serif;
    font-size:12px;font-weight:500;
    background:var(--ink);color:var(--white);
    border:none;border-radius:6px;
    padding:9px 16px;cursor:pointer;
  }
  .toolbtn.secondary{background:transparent;color:var(--ink);border:1.5px solid var(--ink);}
  .toolbtn:active{transform:scale(0.97);}

  .footnote{
    text-align:center;font-size:12px;color:#6b6b66;margin-top:22px;
    font-family:'Noto Sans JP',sans-serif;
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="masthead">
    <h1>街角単語帳</h1>
    <span class="route">道路 507</span>
  </div>

  <div class="catbar" id="catbar">
    <button class="catbtn active" data-cat="all"><span class="dot" style="background:var(--ink);border-radius:2px;"></span>すべて</button>
    <button class="catbtn prohibit" data-cat="prohibit"><span class="dot"></span>禁止</button>
    <button class="catbtn warn" data-cat="warn"><span class="dot"></span>警告</button>
    <button class="catbtn guide" data-cat="guide"><span class="dot"></span>案内</button>
    <button class="catbtn shop" data-cat="shop"><span class="dot"></span>お店</button>
  </div>

  <div class="stage">
    <div class="signboard" id="signboard">
      <div class="inner">
        <div class="face front" id="faceFront">
          <div class="kanji-line" id="kanjiLine"></div>
          <div class="hint">タップして意味を見る</div>
        </div>
        <div class="face back" id="faceBack">
          <div class="meaning" id="meaningText"></div>
          <div class="cat-label" id="catLabel"></div>
        </div>
      </div>
    </div>
    <div class="pole"></div>
  </div>

  <div class="controls">
    <button class="ctrlbtn" id="prevBtn" aria-label="前へ">←</button>
    <button class="ctrlbtn audio" id="audioBtn" aria-label="発音を聞く">🔊</button>
    <div class="progress-post">
      <div class="progress-num" id="progressNum">1 / 50</div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <button class="ctrlbtn audio" id="knowBtn" aria-label="覚えた">✓</button>
    <button class="ctrlbtn" id="nextBtn" aria-label="次へ">→</button>
  </div>

  <div class="toolbar">
    <button class="toolbtn" id="shuffleBtn">シャッフル</button>
    <button class="toolbtn secondary" id="furiBtn">ふりがなを隠す</button>
    <button class="toolbtn secondary" id="resetBtn">進捗リセット</button>
  </div>

  <div class="footnote" id="footnote">覚えた単語: 0 / 50</div>
</div>

<script>
const DATA = [
  {k:"入口",f:"いりぐち",m:"Pintu masuk",cat:"guide"},
  {k:"出口",f:"でぐち",m:"Pintu keluar",cat:"guide"},
  {k:"非常口",f:"ひじょうぐち",m:"Pintu darurat",cat:"guide"},
  {k:"営業中",f:"えいぎょうちゅう",m:"Sedang buka (toko)",cat:"shop"},
  {k:"準備中",f:"じゅんびちゅう",m:"Sedang tutup / persiapan",cat:"shop"},
  {k:"定休日",f:"ていきゅうび",m:"Hari libur tetap",cat:"shop"},
  {k:"立入禁止",f:"たちいりきんし",m:"Dilarang masuk",cat:"prohibit"},
  {k:"駐車禁止",f:"ちゅうしゃきんし",m:"Dilarang parkir",cat:"prohibit"},
  {k:"駐車場",f:"ちゅうしゃじょう",m:"Tempat parkir",cat:"guide"},
  {k:"一方通行",f:"いっぽうつうこう",m:"Jalan satu arah",cat:"prohibit"},
  {k:"止まれ",f:"とまれ",m:"Berhenti",cat:"prohibit"},
  {k:"徐行",f:"じょこう",m:"Pelan-pelan",cat:"warn"},
  {k:"横断歩道",f:"おうだんほどう",m:"Zebra cross",cat:"guide"},
  {k:"歩行者専用",f:"ほこうしゃせんよう",m:"Khusus pejalan kaki",cat:"guide"},
  {k:"工事中",f:"こうじちゅう",m:"Sedang ada konstruksi",cat:"warn"},
  {k:"危険",f:"きけん",m:"Bahaya",cat:"warn"},
  {k:"注意",f:"ちゅうい",m:"Perhatian / hati-hati",cat:"warn"},
  {k:"火気厳禁",f:"かきげんきん",m:"Dilarang keras menyalakan api",cat:"prohibit"},
  {k:"喫煙所",f:"きつえんじょ",m:"Area merokok",cat:"guide"},
  {k:"禁煙",f:"きんえん",m:"Dilarang merokok",cat:"prohibit"},
  {k:"トイレ",f:"トイレ",m:"Toilet",cat:"guide"},
  {k:"お手洗い",f:"おてあらい",m:"Kamar kecil (halus)",cat:"guide"},
  {k:"案内所",f:"あんないじょ",m:"Pusat informasi",cat:"guide"},
  {k:"両替",f:"りょうがえ",m:"Penukaran uang",cat:"shop"},
  {k:"割引",f:"わりびき",m:"Diskon",cat:"shop"},
  {k:"特売",f:"とくばい",m:"Obral / promo khusus",cat:"shop"},
  {k:"新発売",f:"しんはつばい",m:"Rilis baru",cat:"shop"},
  {k:"売り切れ",f:"うりきれ",m:"Habis terjual",cat:"shop"},
  {k:"予約席",f:"よやくせき",m:"Kursi reservasi",cat:"shop"},
  {k:"満席",f:"まんせき",m:"Penuh (kursi/tempat)",cat:"shop"},
  {k:"空室",f:"くうしつ",m:"Kamar kosong (hotel)",cat:"shop"},
  {k:"貸切",f:"かしきり",m:"Disewa penuh / private",cat:"shop"},
  {k:"交番",f:"こうばん",m:"Pos polisi",cat:"guide"},
  {k:"病院",f:"びょういん",m:"Rumah sakit",cat:"guide"},
  {k:"郵便局",f:"ゆうびんきょく",m:"Kantor pos",cat:"guide"},
  {k:"銀行",f:"ぎんこう",m:"Bank",cat:"guide"},
  {k:"薬局",f:"やっきょく",m:"Apotek",cat:"guide"},
  {k:"停留所",f:"ていりゅうじょ",m:"Halte bus",cat:"guide"},
  {k:"踏切",f:"ふみきり",m:"Perlintasan kereta",cat:"warn"},
  {k:"落石注意",f:"らくせきちゅうい",m:"Awas batu jatuh",cat:"warn"},
  {k:"迂回",f:"うかい",m:"Jalan memutar / alternatif",cat:"guide"},
  {k:"通行止め",f:"つうこうどめ",m:"Jalan ditutup",cat:"prohibit"},
  {k:"速度制限",f:"そくどせいげん",m:"Batas kecepatan",cat:"prohibit"},
  {k:"譲れ",f:"ゆずれ",m:"Beri jalan (prioritas)",cat:"warn"},
  {k:"私有地",f:"しゆうち",m:"Tanah pribadi",cat:"prohibit"},
  {k:"監視カメラ作動中",f:"かんしカメラさどうちゅう",m:"CCTV sedang aktif",cat:"guide"},
  {k:"開店",f:"かいてん",m:"Toko buka",cat:"shop"},
  {k:"閉店",f:"へいてん",m:"Toko tutup",cat:"shop"},
  {k:"各種取扱",f:"かくしゅとりあつかい",m:"Menjual / melayani berbagai jenis",cat:"shop"},
  {k:"コインロッカー",f:"コインロッカー",m:"Loker koin",cat:"guide"},
  {k:"自動販売機",f:"じどうはんばいき",m:"Mesin penjual otomatis",cat:"guide"},
  {k:"24時間営業",f:"にじゅうよじかんえいぎょう",m:"Buka 24 jam",cat:"shop"},
  {k:"現金のみ",f:"げんきんのみ",m:"Hanya tunai",cat:"shop"},
  {k:"お持ち帰り",f:"おもちかえり",m:"Bawa pulang / take away",cat:"shop"},
  {k:"満車",f:"まんしゃ",m:"Parkir penuh",cat:"guide"},
  {k:"空車",f:"くうしゃ",m:"Kosong (parkir/taksi)",cat:"guide"},
  {k:"有料",f:"ゆうりょう",m:"Berbayar",cat:"guide"},
  {k:"無料",f:"むりょう",m:"Gratis",cat:"guide"},
  {k:"撮影禁止",f:"さつえいきんし",m:"Dilarang memotret",cat:"prohibit"},
  {k:"スリップ注意",f:"スリップちゅうい",m:"Awas licin",cat:"warn"},
  {k:"頭上注意",f:"ずじょうちゅうい",m:"Awas kepala terbentur",cat:"warn"},
  {k:"段差注意",f:"だんさちゅうい",m:"Awas ada undakan",cat:"warn"},
  {k:"濡れています",f:"ぬれています",m:"Lantai basah",cat:"warn"},
  {k:"自転車専用",f:"じてんしゃせんよう",m:"Khusus sepeda",cat:"guide"},
  {k:"消火器",f:"しょうかき",m:"Alat pemadam api",cat:"guide"},
  {k:"避難場所",f:"ひなんばしょ",m:"Tempat evakuasi",cat:"guide"},
  {k:"給油所",f:"きゅうゆじょ",m:"SPBU",cat:"guide"},
  {k:"温泉",f:"おんせん",m:"Pemandian air panas",cat:"guide"},
  {k:"神社",f:"じんじゃ",m:"Kuil Shinto",cat:"guide"},
  {k:"お寺",f:"おてら",m:"Kuil Buddha",cat:"guide"},
  {k:"展望台",f:"てんぼうだい",m:"Dek pemandangan",cat:"guide"},
  {k:"車両進入禁止",f:"しゃりょうしんにゅうきんし",m:"Kendaraan dilarang masuk",cat:"prohibit"},
  {k:"動物注意",f:"どうぶつちゅうい",m:"Awas hewan menyeberang",cat:"warn"},
  {k:"転落注意",f:"てんらくちゅうい",m:"Awas jatuh",cat:"warn"},
  {k:"使用中",f:"しようちゅう",m:"Sedang digunakan",cat:"shop"},
  {k:"故障中",f:"こしょうちゅう",m:"Sedang rusak",cat:"shop"},
  {k:"お会計はこちら",f:"おかいけいはこちら",m:"Kasir di sini",cat:"shop"},
  {k:"ラストオーダー",f:"ラストオーダー",m:"Pesanan terakhir",cat:"shop"},
  {k:"ペット同伴可",f:"ペットどうはんか",m:"Boleh bawa hewan peliharaan",cat:"shop"},
];

const catNames = {prohibit:"禁止 · larangan", warn:"警告 · peringatan", guide:"案内 · info & petunjuk", shop:"お店 · toko & bisnis"};

let deck = DATA.map((d,i)=>({...d, id:i}));
let filtered = [...deck];
let idx = 0;
let known = new Set();
let flipped = false;

const signboard = document.getElementById('signboard');
const kanjiLine = document.getElementById('kanjiLine');
const meaningText = document.getElementById('meaningText');
const catLabel = document.getElementById('catLabel');
const progressNum = document.getElementById('progressNum');
const progressFill = document.getElementById('progressFill');
const footnote = document.getElementById('footnote');

function render(){
  const card = filtered[idx];
  signboard.className = 'signboard cat-' + card.cat + (flipped ? ' flipped' : '');
  kanjiLine.innerHTML = '<ruby>'+card.k+'<rt>'+card.f+'</rt></ruby>';
  meaningText.textContent = card.m;
  catLabel.textContent = catNames[card.cat];
  progressNum.textContent = (idx+1) + ' / ' + filtered.length;
  progressFill.style.width = (((idx+1)/filtered.length)*100) + '%';
  footnote.textContent = '覚えた単語: ' + known.size + ' / ' + deck.length;
}

function flip(){
  flipped = !flipped;
  signboard.classList.toggle('flipped', flipped);
}

function go(delta){
  flipped = false;
  idx = (idx + delta + filtered.length) % filtered.length;
  kanjiLine.classList.remove('reveal');
  render();
}

function speak(text){
  if(!('speechSynthesis' in window)) return;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ja-JP';
  u.rate = 0.85;
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(u);
}

signboard.addEventListener('click', flip);
kanjiLine.addEventListener('click', (e)=>{
  if(document.body.classList.contains('hide-furi')){
    e.stopPropagation();
    kanjiLine.classList.toggle('reveal');
  }
});
document.getElementById('furiBtn').addEventListener('click', (e)=>{
  e.stopPropagation();
  const hidden = document.body.classList.toggle('hide-furi');
  kanjiLine.classList.remove('reveal');
  e.currentTarget.textContent = hidden ? 'ふりがなを表示' : 'ふりがなを隠す';
});
document.getElementById('prevBtn').addEventListener('click', ()=>go(-1));
document.getElementById('nextBtn').addEventListener('click', ()=>go(1));
document.getElementById('audioBtn').addEventListener('click', (e)=>{
  e.stopPropagation();
  speak(filtered[idx].f);
});
document.getElementById('knowBtn').addEventListener('click', (e)=>{
  e.stopPropagation();
  known.add(filtered[idx].id);
  footnote.textContent = '覚えた単語: ' + known.size + ' / ' + deck.length;
  go(1);
});
document.getElementById('shuffleBtn').addEventListener('click', ()=>{
  for(let i=filtered.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [filtered[i],filtered[j]]=[filtered[j],filtered[i]];
  }
  idx = 0; flipped = false;
  render();
});
document.getElementById('resetBtn').addEventListener('click', ()=>{
  known.clear();
  render();
});
document.getElementById('catbar').addEventListener('click', (e)=>{
  const btn = e.target.closest('.catbtn');
  if(!btn) return;
  document.querySelectorAll('.catbtn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const cat = btn.dataset.cat;
  filtered = cat === 'all' ? [...deck] : deck.filter(d=>d.cat===cat);
  idx = 0; flipped = false;
  render();
});
document.addEventListener('keydown', (e)=>{
  if(e.key==='ArrowRight') go(1);
  if(e.key==='ArrowLeft') go(-1);
  if(e.key===' '){ e.preventDefault(); flip(); }
});

render();
</script>
</body>
</html>
