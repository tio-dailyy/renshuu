<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>日本の街角単語帳</title>
<script src="kanji-detail.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sign-blue:#0B5FA5;
    --sign-blue-dark:#063E6E;
    --sign-red:#C8102E;
    --sign-red-dark:#8C0A20;
    --sign-yellow:#FFD400;
    --sign-yellow-dark:#9C7E00;
    --sign-green:#1B7A3D;
    --sign-green-dark:#0F4E27;
    --sign-purple:#5B3A9E;
    --sign-purple-dark:#3B2568;
    --concrete:#EDEAE0;
    --concrete-line:#D8D4C6;
    --ink:#1C1C1C;
    --pole:#8C8C86;
    --white:#FAFAF7;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      repeating-linear-gradient(90deg, transparent, transparent 78px, rgba(0,0,0,0.02) 78px, rgba(0,0,0,0.02) 80px),
      var(--concrete);
    font-family:'Noto Sans JP','Oswald',sans-serif;
    color:var(--ink);
    padding:16px 12px 32px;
  }
  .wrap{max-width:640px;margin:0 auto;width:100%;}

  .masthead{
    display:flex;align-items:center;justify-content:space-between;
    flex-wrap:wrap;gap:8px;
    margin-bottom:16px;
  }
  .masthead h1{
    font-family:'Oswald',sans-serif;
    font-weight:700;
    font-size:clamp(17px,5vw,20px);
    letter-spacing:0.5px;
    margin:0;
    color:var(--sign-blue-dark);
  }
  .masthead .route{
    font-family:'Oswald',sans-serif;
    background:var(--sign-green);
    color:var(--white);
    font-weight:600;
    font-size:12px;
    padding:5px 10px;
    border:2px solid var(--white);
    outline:2px solid var(--sign-green-dark);
    border-radius:3px;
    white-space:nowrap;
  }

  .catbar{
    display:flex;gap:8px;flex-wrap:wrap;
    margin-bottom:18px;
  }
  .catbtn{
    font-family:'Noto Sans JP',sans-serif;
    font-size:12px;
    font-weight:500;
    border:none;
    cursor:pointer;
    padding:7px 12px 7px 10px;
    display:flex;align-items:center;gap:6px;
    border-radius:20px;
    background:var(--white);
    border:1.5px solid var(--concrete-line);
    color:var(--ink);
    transition:transform .12s ease;
  }
  .catbtn .dot{width:12px;height:12px;flex:none;}
  .catbtn.prohibit .dot{background:var(--sign-red);border-radius:50%;border:2px solid var(--ink);}
  .catbtn.warn .dot{background:var(--sign-yellow);clip-path:polygon(50% 0,100% 100%,0 100%);}
  .catbtn.guide .dot{background:var(--sign-blue);border-radius:2px;}
  .catbtn.shop .dot{background:var(--sign-green);transform:rotate(45deg);}
  .catbtn.study .dot{background:var(--sign-purple);border-radius:3px;}
  .catbtn.active{background:var(--ink);color:var(--white);border-color:var(--ink);}
  .catbtn:active{transform:scale(0.96);}

  .stage{
    display:flex;flex-direction:column;align-items:center;
    margin-bottom:16px;
  }

  .pole{
    width:10px;height:22px;
    background:linear-gradient(90deg,#6b6b66,var(--pole),#6b6b66);
    border-radius:2px 2px 0 0;
  }

  .signboard{
    width:100%;
    max-width:420px;
    aspect-ratio:4/3;
    perspective:1400px;
    cursor:pointer;
    user-select:none;
  }
  .signboard .inner{
    position:relative;width:100%;height:100%;
    transition:transform .5s cubic-bezier(.4,.2,.2,1);
    transform-style:preserve-3d;
  }
  .signboard.flipped .inner{transform:rotateY(180deg);}
  .face{
    position:absolute;inset:0;
    border-radius:14px;
    backface-visibility:hidden;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:16px;
    border:6px solid var(--white);
    outline:3px solid var(--sign-blue-dark);
    outline-offset:-2px;
  }
  .face.front{background:var(--sign-blue);color:var(--white);}
  .face.back{
    background:var(--white);
    color:var(--ink);
    transform:rotateY(180deg);
    outline-color:var(--sign-blue-dark);
    overflow-y:auto;
    justify-content:flex-start;
    padding-top:22px;
  }
  .radical-note{
    margin-top:14px;
    font-size:12px;
    line-height:1.55;
    text-align:center;
    color:#4a4a45;
    background:var(--concrete);
    border:1px dashed var(--concrete-line);
    border-radius:8px;
    padding:10px 12px;
  }
  .radical-note b{color:var(--ink);}
  .cat-prohibit .face{outline-color:var(--sign-red-dark);}
  .cat-prohibit .face.front{background:var(--sign-red);}
  .cat-warn .face{outline-color:var(--sign-yellow-dark);}
  .cat-warn .face.front{background:var(--sign-yellow);color:var(--ink);}
  .cat-guide .face{outline-color:var(--sign-blue-dark);}
  .cat-guide .face.front{background:var(--sign-blue);}
  .cat-shop .face{outline-color:var(--sign-green-dark);}
  .cat-shop .face.front{background:var(--sign-green);}
  .cat-study .face{outline-color:var(--sign-purple-dark);}
  .cat-study .face.front{background:var(--sign-purple);}

  .kanji-line{
    font-weight:700;
    line-height:1.3;text-align:center;
    word-break:keep-all;
  }
  .kanji-line.len-s{font-size:clamp(30px,9vw,44px);}
  .kanji-line.len-m{font-size:clamp(24px,7.5vw,36px);}
  .kanji-line.len-l{font-size:clamp(19px,6vw,28px);}
  .kanji-line.len-xl{font-size:clamp(15px,5vw,22px);}
  ruby{ruby-position:over;}
  rt{font-size:0.34em;font-weight:500;opacity:0.92;transition:opacity .15s ease;}
  body.hide-furi rt{opacity:0;}
  body.hide-furi .kanji-line{cursor:pointer;}
  body.hide-furi .kanji-line::after{
    content:'タップで読み方を確認';
    display:block;font-family:'Oswald',sans-serif;
    font-size:10px;letter-spacing:1px;text-transform:uppercase;
    opacity:0.75;margin-top:8px;
  }
  body.hide-furi .kanji-line.reveal rt{opacity:0.92;}
  body.hide-furi .kanji-line.reveal::after{display:none;}
  .hint{
    margin-top:14px;font-family:'Oswald',sans-serif;
    font-size:11px;letter-spacing:1.5px;text-transform:uppercase;
    opacity:0.75;
  }
  .meaning{
    font-size:clamp(16px,4.8vw,24px);font-weight:500;text-align:center;line-height:1.4;
  }
  .cat-label{
    font-family:'Oswald',sans-serif;
    font-size:11px;letter-spacing:1.5px;text-transform:uppercase;
    color:var(--sign-blue-dark);
    margin-top:10px;
  }
  .cat-prohibit .cat-label{color:var(--sign-red-dark);}
  .cat-warn .cat-label{color:var(--sign-yellow-dark);}
  .cat-guide .cat-label{color:var(--sign-blue-dark);}
  .cat-shop .cat-label{color:var(--sign-green-dark);}
  .cat-study .cat-label{color:var(--sign-purple-dark);}

  .controls{
    display:flex;align-items:center;justify-content:center;gap:clamp(8px,3vw,14px);
    margin-top:16px;
  }
  .ctrlbtn{
    background:var(--white);
    border:1.5px solid var(--ink);
    color:var(--ink);
    width:clamp(36px,10vw,42px);height:clamp(36px,10vw,42px);
    flex:none;
    border-radius:50%;
    font-size:16px;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:transform .1s ease;
  }
  .ctrlbtn:active{transform:scale(0.9);}
  .ctrlbtn.skip{border-color:var(--sign-red-dark);color:var(--sign-red-dark);font-size:15px;}
  .ctrlbtn.know{border-color:var(--sign-green-dark);color:var(--sign-green-dark);font-size:15px;}
  .audiorow{display:flex;justify-content:center;margin-top:10px;}
  .audiorow .ctrlbtn.audio{
    width:auto;height:auto;border-radius:20px;
    padding:8px 18px;
    font-family:'Noto Sans JP',sans-serif;
    font-size:12px;font-weight:500;
    border-color:var(--sign-blue-dark);color:var(--sign-blue-dark);
    gap:6px;
  }
  .progress-post{
    display:flex;flex-direction:column;align-items:center;
    font-family:'Oswald',sans-serif;
    flex:none;
  }
  .progress-num{font-size:14px;font-weight:600;white-space:nowrap;}
  .progress-track{
    width:clamp(70px,22vw,120px);height:5px;background:var(--concrete-line);
    border-radius:3px;overflow:hidden;margin-top:4px;
  }
  .progress-fill{height:100%;background:var(--sign-green);border-radius:3px;transition:width .25s ease;}

  .toolbar{
    display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:18px;
  }
  .toolbtn{
    font-family:'Noto Sans JP',sans-serif;
    font-size:12px;font-weight:500;
    background:var(--ink);color:var(--white);
    border:none;border-radius:6px;
    padding:9px 14px;cursor:pointer;
    white-space:nowrap;
  }
  .toolbtn.secondary{background:transparent;color:var(--ink);border:1.5px solid var(--ink);}
  .toolbtn:active{transform:scale(0.97);}

  .footnote{
    text-align:center;font-size:12px;color:#6b6b66;margin-top:22px;
    font-family:'Noto Sans JP',sans-serif;
  }

  @media (max-width:360px){
    .catbtn{font-size:11px;padding:6px 10px 6px 8px;}
    .hint{font-size:10px;}
    .progress-num{font-size:12px;}
  }

  .kj{
    cursor:pointer;
    text-decoration:underline dotted currentColor;
    text-underline-offset:6px;
    text-decoration-thickness:1.5px;
    opacity:0.98;
  }
  .kj:active{opacity:0.6;}

  .kanji-modal{
    position:fixed;inset:0;
    background:rgba(20,18,14,0.6);
    display:flex;align-items:center;justify-content:center;
    padding:20px;
    z-index:60;
    opacity:0;pointer-events:none;
    transition:opacity .18s ease;
  }
  .kanji-modal.open{opacity:1;pointer-events:auto;}
  .kanji-modal-content{
    background:var(--white);
    border-radius:16px;
    max-width:380px;width:100%;
    max-height:82vh;overflow-y:auto;
    padding:24px 20px 26px;
    position:relative;
    border:3px solid var(--ink);
    font-family:'Noto Sans JP',sans-serif;
  }
  .kj-modal-close{
    position:absolute;top:12px;right:14px;
    font-size:20px;line-height:1;
    cursor:pointer;color:#8a8a82;
    width:28px;height:28px;
    display:flex;align-items:center;justify-content:center;
    border-radius:50%;
  }
  .kj-modal-close:active{background:var(--concrete);}
  .kj-modal-char{
    font-weight:700;font-size:58px;text-align:center;
    color:var(--sign-blue-dark);margin-bottom:2px;
  }
  .kj-modal-yomi{
    display:flex;justify-content:center;gap:8px;flex-wrap:wrap;
    margin-bottom:4px;
  }
  .kj-modal-yomi span{
    font-family:'Noto Sans JP',sans-serif;
    font-size:13px;font-weight:500;
    padding:3px 10px;border-radius:12px;
  }
  .yomi-on{background:#e3ecf5;color:var(--sign-blue-dark);}
  .yomi-kun{background:#eee7f7;color:var(--sign-purple-dark);}
  .kj-modal-section-title{
    font-family:'Oswald',sans-serif;
    font-size:11px;letter-spacing:1.5px;text-transform:uppercase;
    color:#8a8a82;margin-top:18px;margin-bottom:8px;
  }
  .kj-comp-list{display:flex;flex-direction:column;gap:6px;}
  .kj-comp{
    display:flex;align-items:center;gap:12px;
    background:var(--concrete);border-radius:8px;
    padding:9px 12px;
  }
  .kj-comp-ch{
    font-weight:700;font-size:24px;color:var(--ink);
    flex:none;width:34px;text-align:center;
  }
  .kj-comp-m{font-size:13px;color:#4a4a45;line-height:1.4;}
  .kj-modal-mnemonic{font-size:14.5px;line-height:1.65;color:#2a2a26;}
  .kj-modal-example{font-size:15px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;}
  .kj-modal-example ruby{ruby-position:over;}
  .kj-modal-example rt{font-size:11px;}
  .kj-modal-example .ex-m{color:#4a4a45;font-size:13px;}
  .kj-modal-sentence{font-size:15px;line-height:1.6;color:#1a1a18;}
  .kj-modal-sentence-m{font-size:13px;color:#6b6b66;margin-top:3px;font-style:italic;}
</style>
</head>
<body>
<div class="wrap">

  <div class="masthead">
    <h1>街角単語帳</h1>
    <span class="route">道路 507</span>
  </div>

  <div class="catbar" id="catbar">
    <button class="catbtn active" data-cat="all"><span class="dot" style="background:var(--ink);border-radius:2px;"></span>すべて</button>
    <button class="catbtn prohibit" data-cat="prohibit"><span class="dot"></span>禁止</button>
    <button class="catbtn warn" data-cat="warn"><span class="dot"></span>警告</button>
    <button class="catbtn guide" data-cat="guide"><span class="dot"></span>案内</button>
    <button class="catbtn shop" data-cat="shop"><span class="dot"></span>お店</button>
    <button class="catbtn study" data-cat="study"><span class="dot"></span>N5-N3単語</button>
  </div>

  <div class="stage">
    <div class="signboard" id="signboard">
      <div class="inner">
        <div class="face front" id="faceFront">
          <div class="kanji-line" id="kanjiLine"></div>
          <div class="hint">タップして意味を見る</div>
        </div>
        <div class="face back" id="faceBack">
          <div class="meaning" id="meaningText"></div>
          <div class="cat-label" id="catLabel"></div>
          <div class="radical-note" id="radicalNote"></div>
        </div>
      </div>
    </div>
    <div class="pole"></div>
  </div>

  <div class="controls">
    <button class="ctrlbtn" id="prevBtn" aria-label="前へ">←</button>
    <button class="ctrlbtn skip" id="skipBtn" aria-label="まだ覚えていない">✗</button>
    <div class="progress-post">
      <div class="progress-num" id="progressNum">Lv 1/5</div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <button class="ctrlbtn know" id="knowBtn" aria-label="覚えた">✓</button>
    <button class="ctrlbtn" id="nextBtn" aria-label="次へ">→</button>
  </div>
  <div class="audiorow">
    <button class="ctrlbtn audio" id="audioBtn" aria-label="発音を聞く">🔊 発音を聞く</button>
  </div>

  <div class="toolbar">
    <button class="toolbtn" id="shuffleBtn">シャッフル</button>
    <button class="toolbtn secondary" id="furiBtn">ふりがなを隠す</button>
    <button class="toolbtn secondary" id="resetBtn">進捗リセット</button>
  </div>
  <div class="toolbar">
    <button class="toolbtn secondary" id="exportBtn">📤 進捗をエクスポート</button>
    <button class="toolbtn secondary" id="importBtn">📥 進捗をインポート</button>
    <input type="file" id="importFile" accept="application/json" style="display:none;">
  </div>

  <div class="footnote" id="footnote">習得した単語: 0 / 103</div>
</div>

<div class="kanji-modal" id="kanjiModal">
  <div class="kanji-modal-content" id="kanjiModalContent"></div>
</div>

const catNames = {prohibit:"禁止 · larangan", warn:"警告 · peringatan", guide:"案内 · info & petunjuk", shop:"お店 · toko & bisnis", study:"単語 · kosakata N5-N3"};
const STORAGE_KEY = 'nihongo_street_signs_progress_v1';
const hasCloudStorage = (typeof window.storage !== 'undefined');

let deck = DATA.map((d,i)=>({...d, id:i}));
let pool = [...deck];         // cards under current category filter
let boxes = {};                // id -> mastery level 1..5 (1=new/hard, 5=mastered)
let queue = [];                // history + upcoming drawn cards (array of ids)
let pos = 0;                   // current position in queue
let flipped = false;
let currentCat = 'all';

deck.forEach(d => boxes[d.id] = 1);

const signboard = document.getElementById('signboard');
const kanjiLine = document.getElementById('kanjiLine');

const catLabel = document.getElementById('catLabel');
const radicalNote = document.getElementById('radicalNote');

const kanjiModalContent = document.getElementById('kanjiModalContent');

function lenClass(text){
  const n = text.length;
  if(n<=4) return 'len-s';
  if(n<=6) return 'len-m';
  if(n<=8) return 'len-l';
  return 'len-xl';
}

// ---- persistence ----
async function saveProgress(){
  const payload = JSON.stringify({boxes});
  try{
    if(hasCloudStorage){
      await window.storage.set(STORAGE_KEY, payload, false);
    }else{
      localStorage.setItem(STORAGE_KEY, payload);
    }
  }catch(e){ /* saving is best-effort */ }
}
async function loadProgress(){
  try{
    if(hasCloudStorage){
      const r = await window.storage.get(STORAGE_KEY, false);
      return r ? JSON.parse(r.value) : null;
    }else{
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : null;
    }
  }catch(e){ return null; }
}

// ---- weighted random draw (spaced-repetition-ish) ----
// lower box = higher weight = shows up sooner/more often; box 5 = rare but never fully gone
function weightOf(id){ return Math.max(1, 6 - (boxes[id]||1)); }

function drawNext(excludeId){
  const candidates = pool.length ? pool : deck;
  let bag = [];
  candidates.forEach(c => { for(let i=0;i<weightOf(c.id);i++) bag.push(c.id); });
  if(candidates.length > 1 && excludeId !== undefined){
    const trimmed = bag.filter(id => id !== excludeId);
    if(trimmed.length) bag = trimmed;
  }
  return bag[Math.floor(Math.random()*bag.length)];
}

function cardById(id){ return deck[id]; }

function masteredCount(){
  return deck.filter(d => boxes[d.id] >= 5).length;
}

function wrapKanji(text){
  let out = '';
  for(const ch of text){
    if(/[\u4e00-\u9faf]/.test(ch)){
      out += '<span class="kj" data-ch="'+ch+'">'+ch+'</span>';
    }else{
      out += ch;
    }
  }
  return out;
}

function render(){
  const id = queue[pos];
  const card = cardById(id);
  const box = boxes[id];
  signboard.className = 'signboard cat-' + card.cat + (flipped ? ' flipped' : '');
  kanjiLine.className = 'kanji-line ' + lenClass(card.k);
  kanjiLine.innerHTML = '<ruby>'+wrapKanji(card.k)+'<rt>'+card.f+'</rt></ruby>';
  meaningText.textContent = card.m;
  catLabel.textContent = catNames[card.cat];
  radicalNote.innerHTML = '<b>🧩 Radikal:</b> ' + (RADICALS[card.k] || '');
  progressNum.textContent = 'Lv ' + box + '/5';
  progressFill.style.width = ((box/5)*100) + '%';
  footnote.textContent = '習得した単語: ' + masteredCount() + ' / ' + deck.length;
}

function flip(){
  flipped = !flipped;
  signboard.classList.toggle('flipped', flipped);
}

// move within existing history, or draw a fresh weighted card at the end
function goNext(){
  flipped = false;
  kanjiLine.classList.remove('reveal');
  if(pos < queue.length - 1){
    pos++;
  }else{
    const nextId = drawNext(queue[pos]);
    queue.push(nextId);
    pos++;
  }
  render();
}
function goPrev(){
  flipped = false;
  kanjiLine.classList.remove('reveal');
  if(pos > 0) pos--;
  render();
}

// mark decision: adjust mastery level, then always jump to a brand-new draw
function mark(delta){
  const id = queue[pos];
  boxes[id] = Math.max(1, Math.min(5, boxes[id] + delta));
  saveProgress();
  flipped = false;
  kanjiLine.classList.remove('reveal');
  const nextId = drawNext(id);
  queue = queue.slice(0, pos+1);
  queue.push(nextId);
  pos++;
  render();
}

function resetQueue(){
  const firstId = drawNext();
  queue = [firstId];
  pos = 0;
  flipped = false;
  render();
}

function speak(text){
  if(!('speechSynthesis' in window)) return;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ja-JP';
  u.rate = 0.85;
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(u);
}

// ---- per-kanji detail modal ----
function openKanjiDetail(ch){
  const d = (typeof KANJI_DETAIL !== 'undefined') ? KANJI_DETAIL[ch] : null;
  if(!d){
    kanjiModalContent.innerHTML =
      '<div class="kj-modal-close" id="kjModalClose">✕</div>' +
      '<div class="kj-modal-char">'+ch+'</div>' +
      '<div class="kj-modal-mnemonic">Detail untuk karakter ini belum tersedia.</div>';
    kanjiModal.classList.add('open');
    document.getElementById('kjModalClose').addEventListener('click', closeKanjiModal);
    return;
  }
  const compHtml = d.c.map(([c,m]) =>
    '<div class="kj-comp"><span class="kj-comp-ch">'+c+'</span><span class="kj-comp-m">'+m+'</span></div>'
  ).join('');
  kanjiModalContent.innerHTML =
    '<div class="kj-modal-close" id="kjModalClose">✕</div>' +
    '<div class="kj-modal-char">'+ch+'</div>' +
    '<div class="kj-modal-yomi">' +
      (d.on ? '<span class="yomi-on">音 '+d.on+'</span>' : '') +
      (d.kun ? '<span class="yomi-kun">訓 '+d.kun+'</span>' : '') +
    '</div>' +
    '<div class="kj-modal-section-title">部品 · Komponen</div>' +
    '<div class="kj-comp-list">'+compHtml+'</div>' +
    '<div class="kj-modal-section-title">💡 Mnemonik</div>' +
    '<div class="kj-modal-mnemonic">'+d.mn+'</div>' +
    '<div class="kj-modal-section-title">📝 Contoh kata</div>' +
    '<div class="kj-modal-example"><ruby>'+d.w+'<rt>'+d.r+'</rt></ruby><span class="ex-m">— '+d.wm+'</span></div>' +
    (d.sent ? (
      '<div class="kj-modal-section-title">📖 Contoh kalimat</div>' +
      '<div class="kj-modal-sentence">'+d.sent+'</div>' +
      '<div class="kj-modal-sentence-m">'+d.sentM+'</div>'
    ) : '');
  kanjiModal.classList.add('open');
  document.getElementById('kjModalClose').addEventListener('click', closeKanjiModal);
}
function closeKanjiModal(){
  kanjiModal.classList.remove('open');
}
kanjiModal.addEventListener('click', (e)=>{
  if(e.target === kanjiModal) closeKanjiModal();
});

// ---- manual export/import backup (works even without any browser storage) ----
function exportProgress(){
  const payload = JSON.stringify({boxes}, null, 1);
  const blob = new Blob([payload], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'nihongo_progress.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function importProgressFile(file){
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const data = JSON.parse(e.target.result);
      if(data && data.boxes){
        deck.forEach(d => { if(data.boxes[d.id] !== undefined) boxes[d.id] = data.boxes[d.id]; });
        saveProgress();
        resetQueue();
      }
    }catch(err){
      alert('File progres tidak valid.');
    }
  };
  reader.readAsText(file);
}

signboard.addEventListener('click', flip);
kanjiLine.addEventListener('click', (e)=>{
  const kjSpan = e.target.closest('.kj');
  if(kjSpan){
    e.stopPropagation();
    openKanjiDetail(kjSpan.dataset.ch);
    return;
  }
  if(document.body.classList.contains('hide-furi')){
    e.stopPropagation();
    kanjiLine.classList.toggle('reveal');
  }
});
document.getElementById('furiBtn').addEventListener('click', (e)=>{
  e.stopPropagation();
  const hidden = document.body.classList.toggle('hide-furi');
  kanjiLine.classList.remove('reveal');
  e.currentTarget.textContent = hidden ? 'ふりがなを表示' : 'ふりがなを隠す';
});
document.getElementById('prevBtn').addEventListener('click', goPrev);
document.getElementById('nextBtn').addEventListener('click', goNext);
document.getElementById('audioBtn').addEventListener('click', (e)=>{
  e.stopPropagation();
  speak(cardById(queue[pos]).f);
});
// skip = "belum hafal" -> mastery turun 2 level -> lebih sering muncul lagi
document.getElementById('skipBtn').addEventListener('click', (e)=>{
  e.stopPropagation();
  mark(-2);
});
// tahu = "sudah hafal" -> mastery naik 1 level -> makin jarang muncul, tapi tetap sesekali
document.getElementById('knowBtn').addEventListener('click', (e)=>{
  e.stopPropagation();
  mark(1);
});
document.getElementById('shuffleBtn').addEventListener('click', ()=>{
  resetQueue();
});
document.getElementById('resetBtn').addEventListener('click', ()=>{
  deck.forEach(d => boxes[d.id] = 1);
  saveProgress();
  resetQueue();
});
document.getElementById('exportBtn').addEventListener('click', exportProgress);
document.getElementById('importBtn').addEventListener('click', ()=>{
  document.getElementById('importFile').click();
});
document.getElementById('importFile').addEventListener('change', (e)=>{
  const f = e.target.files[0];
  if(f) importProgressFile(f);
  e.target.value = '';
});
document.getElementById('catbar').addEventListener('click', (e)=>{
  const btn = e.target.closest('.catbtn');
  if(!btn) return;
  document.querySelectorAll('.catbtn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  currentCat = btn.dataset.cat;
  pool = currentCat === 'all' ? [...deck] : deck.filter(d=>d.cat===currentCat);
  resetQueue();
});
document.addEventListener('keydown', (e)=>{
  if(kanjiModal.classList.contains('open')){
    if(e.key==='Escape') closeKanjiModal();
    return;
  }
  if(e.key==='ArrowRight') goNext();
  if(e.key==='ArrowLeft') goPrev();
  if(e.key===' '){ e.preventDefault(); flip(); }
});

// ---- init: load saved progress, then draw first card ----
(async function init(){
  const saved = await loadProgress();
  if(saved && saved.boxes){
    deck.forEach(d => { if(saved.boxes[d.id] !== undefined) boxes[d.id] = saved.boxes[d.id]; });
  }
  resetQueue();
})();
</script>
