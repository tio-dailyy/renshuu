<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日本語 街角学習</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sign-blue:#0B5FA5;
    --sign-blue-dark:#063E6E;
    --sign-green:#1B7A3D;
    --sign-green-dark:#0F4E27;
    --concrete:#EDEAE0;
    --concrete-line:#D8D4C6;
    --ink:#1C1C1C;
    --pole:#8C8C86;
    --white:#FAFAF7;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:
      repeating-linear-gradient(90deg, transparent, transparent 78px, rgba(0,0,0,0.02) 78px, rgba(0,0,0,0.02) 80px),
      var(--concrete);
    font-family:'Noto Sans JP','Oswald',sans-serif;
    color:var(--ink);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:36px 16px 48px;
  }

  .masthead{text-align:center;margin-bottom:8px;}
  .masthead .route{
    display:inline-block;
    font-family:'Oswald',sans-serif;
    background:var(--sign-green);
    color:var(--white);
    font-weight:600;
    font-size:12px;
    letter-spacing:1px;
    padding:4px 10px;
    border:2px solid var(--white);
    outline:2px solid var(--sign-green-dark);
    border-radius:3px;
    margin-bottom:14px;
  }
  .masthead h1{
    font-family:'Oswald',sans-serif;
    font-weight:700;
    font-size:24px;
    letter-spacing:0.5px;
    margin:0 0 6px;
    color:var(--sign-blue-dark);
  }
  .masthead p{
    font-size:13px;
    color:#6b6b66;
    margin:0;
  }

  .signpost{
    display:flex;
    flex-direction:column;
    align-items:center;
    margin-top:34px;
    width:100%;
    max-width:420px;
  }
  .cap{
    width:16px;height:16px;
    background:var(--pole);
    border-radius:50%;
  }
  .pole-seg{
    width:10px;height:26px;
    background:linear-gradient(90deg,#6b6b66,var(--pole),#6b6b66);
  }

  .arm{
    position:relative;
    display:block;
    text-decoration:none;
    color:var(--white);
    width:100%;
    padding:18px 26px 18px 22px;
    margin-top:22px;
    border:4px solid var(--white);
    outline:3px solid var(--sign-blue-dark);
    outline-offset:-1px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    transition:transform .15s ease, filter .15s ease;
  }
  .arm:active{transform:scale(0.97);}
  .arm:hover{filter:brightness(1.05);}

  .arm.right{
    background:var(--sign-blue);
    outline-color:var(--sign-blue-dark);
    border-radius:6px 32px 32px 6px;
  }
  .arm.left{
    background:var(--sign-green);
    outline-color:var(--sign-green-dark);
    border-radius:32px 6px 6px 32px;
    flex-direction:row-reverse;
  }
  .arm.n3{
    background:#8F2D2D;
    outline-color:#5E1717;
    border-radius:6px 32px 32px 6px;
  }

  .arm-text{display:flex;flex-direction:column;gap:2px;}
  .arm-jp{
    font-family:'Noto Sans JP',sans-serif;
    font-weight:700;
    font-size:19px;
    letter-spacing:0.5px;
  }
  .arm-en{
    font-family:'Oswald',sans-serif;
    font-size:11px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    opacity:0.85;
  }
  .arm-arrow{
    font-family:'Oswald',sans-serif;
    font-size:22px;
    font-weight:600;
    flex:none;
  }

  .base{
    width:64px;height:14px;
    background:linear-gradient(180deg,#9a9a92,#6b6b66);
    border-radius:3px;
    margin-top:2px;
  }

  .footnote{
    margin-top:38px;
    font-size:12px;
    color:#8a8a82;
    text-align:center;
  }
</style>
</head>
<body>

  <div class="masthead">
    <span class="route">道路 507</span>
    <h1>日本語 街角学習</h1>
    <p>進みたい方向を選んでください</p>
  </div>

  <div class="signpost">
    <div class="cap"></div>
    <div class="pole-seg"></div>

    <a class="arm right" href="index_sign.html">
      <div class="arm-text">
        <span class="arm-jp">街角単語帳</span>
        <span class="arm-en">street sign vocabulary</span>
      </div>
      <span class="arm-arrow">→</span>
    </a>

    <a class="arm left" href="index_renshuu.html">
      <div class="arm-text">
        <span class="arm-jp">練習問題</span>
        <span class="arm-en">practice exercises</span>
      </div>
      <span class="arm-arrow">←</span>
    </a>

    <a class="arm n3" href="n3.html">
      <div class="arm-text">
        <span class="arm-jp">N3 合格ルート</span>
        <span class="arm-en">study · drill · mock test</span>
      </div>
      <span class="arm-arrow">→</span>
    </a>

    <div class="pole-seg" style="height:60px;"></div>
    <div class="base"></div>
  </div>

  <div class="footnote">タップして選択したページへ移動します</div>

</body>
</html>
